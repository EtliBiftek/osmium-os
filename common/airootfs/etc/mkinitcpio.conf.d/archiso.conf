HOOKS=(base udev modconf memdisk archiso archiso_loop_mnt archiso_pxe_common archiso_pxe_nbd archiso_pxe_http archiso_pxe_nfs block filesystems keyboard)
COMPRESSION="zstd"
COMPRESSION_OPTIONS=(-19 -T0)
# Replaces releng's file of the same name (keep HOOKS in sync with it). Differences:
# - no `microcode` hook: mkarchiso then puts amd-ucode.img/intel-ucode.img next to the kernel on
#   the ISO, where osmium-install copies them to the installed /boot (mkarchiso empties /boot in
#   the squashfs, which left the installed ucode packages with missing files).
# - zstd instead of xz -9e: the live initramfs unpacks several times faster at boot.
