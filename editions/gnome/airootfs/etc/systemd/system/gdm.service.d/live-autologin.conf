# /etc/gdm/custom.conf is owned by gdm (the overlay is copied before pacman runs, so shipping it
# would conflict). Patch it at start instead; this drop-in is removed on install.
[Service]
ExecStartPre=/bin/sh -c "grep -q '^AutomaticLogin=' /etc/gdm/custom.conf || sed -i -e '/^[[]daemon]/a AutomaticLogin=osmium' -e '/^[[]daemon]/a AutomaticLoginEnable=True' /etc/gdm/custom.conf"
