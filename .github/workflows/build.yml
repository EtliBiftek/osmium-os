name: Build ISO
on:
  workflow_dispatch:
  push:
    branches: [main]

# One build at a time: runs share the published repo release.
concurrency:
  group: build
  cancel-in-progress: true

jobs:
  packages:
    runs-on: ubuntu-latest
    container: archlinux:latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Install tools
        run: pacman -Syu --noconfirm base-devel git python rust github-cli hyprland pacman-contrib
      - name: Verify Hyprland config
        run: |
          useradd -m checker
          install -o checker -m 644 packages/osmium-hyprland/skel/.config/hypr/hyprland.lua /tmp/hyprland.lua
          install -d -o checker -m 700 /tmp/xdg
          runuser -u checker -- env XDG_RUNTIME_DIR=/tmp/xdg Hyprland --verify-config --config /tmp/hyprland.lua
          # Each mode's hypr lines must also be valid Lua for this Hyprland.
          for m in tools/data/modes/*.mode; do
            { cat /tmp/hyprland.lua; sed -n 's/^hypr *= *//p' "$m"; } > /tmp/mode.lua
            chown checker /tmp/mode.lua
            echo "== $m"
            runuser -u checker -- env XDG_RUNTIME_DIR=/tmp/xdg Hyprland --verify-config --config /tmp/mode.lua
          done
      - name: Test tools
        run: cargo test --locked --manifest-path tools/Cargo.toml
      - name: Smoke-test osmium-update against live Arch News
        run: |
          cargo run -q --locked --manifest-path tools/Cargo.toml --bin osmium-update -- check || [ $? -eq 2 ]
      - name: Build packages
        env:
          OSMIUM_REPO: https://github.com/${{ github.repository }}/releases/download/repo
        run: cargo run --release --locked --manifest-path tools/Cargo.toml --bin osmium-build -- packages
      - name: Publish pacman repo
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release view repo -R "$GITHUB_REPOSITORY" >/dev/null 2>&1 || \
            gh release create repo -R "$GITHUB_REPOSITORY" --title "Package repo" --notes "pacman repo for OsmiumOS" --latest=false
          gh release upload repo repo/* -R "$GITHUB_REPOSITORY" --clobber
          # Drop package files no longer in the repo db.
          for a in $(gh release view repo -R "$GITHUB_REPOSITORY" --json assets -q '.assets[].name'); do
            [ -e "repo/$a" ] || gh release delete-asset repo "$a" -R "$GITHUB_REPOSITORY" -y
          done
          # Release downloads lag a few seconds behind uploads; the ISO job needs them live.
          for f in repo/*; do
            url="https://github.com/$GITHUB_REPOSITORY/releases/download/repo/$(basename "$f")"
            for i in $(seq 30); do curl -fsIL -o /dev/null "$url" && break; sleep 5; done
            curl -fsIL -o /dev/null "$url"
          done

  iso:
    needs: packages
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        edition: [hyprland]  # later: kde, gnome
    container:
      image: archlinux:latest
      options: --privileged
    steps:
      - uses: actions/checkout@v4
      - name: Install archiso
        run: pacman -Syu --noconfirm archiso rust
      - name: Build ${{ matrix.edition }}
        run: cargo run --release --locked --manifest-path tools/Cargo.toml --bin osmium-build -- iso ${{ matrix.edition }}
      - uses: actions/upload-artifact@v4
        with:
          name: osmiumos-${{ matrix.edition }}
          path: out/*.iso
          compression-level: 0
