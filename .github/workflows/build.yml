name: Build ISO
on:
  workflow_dispatch:
  push:
    branches: [main]

# One build at a time per branch. Only main publishes the repo release; other branches
# (workflow_dispatch) pass their packages to the ISO job as an artifact.
concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  packages:
    runs-on: ubuntu-latest
    container: archlinux:latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
      - name: Install tools
        # Build deps of our packages (osmium-build runs makepkg with --nodeps).
        run: pacman -Syu --noconfirm base-devel git python rust github-cli pacman-contrib librsvg wayland libxkbcommon libinput seatd systemd-libs libdrm mesa libglvnd boost gtk3
      - name: Test tools
        run: cargo test --locked --manifest-path tools/Cargo.toml
      - name: Smoke-test osmium-update against live Arch News
        run: |
          cargo run -q --locked --manifest-path tools/Cargo.toml --bin osmium-update -- check || [ $? -eq 2 ]
      - name: Import signing key
        env:
          KEY: ${{ secrets.OSMIUM_GPG_PRIVATE_KEY }}
        run: |
          if [ -n "$KEY" ]; then echo "$KEY" | gpg --batch --import; else echo "no signing key: repo stays unsigned"; fi
      - name: Build packages
        env:
          OSMIUM_REPO: https://github.com/${{ github.repository }}/releases/download/repo
          OSMIUM_GPG_KEY_ID: ${{ secrets.OSMIUM_GPG_KEY_ID }}
        run: cargo run --release --locked --manifest-path tools/Cargo.toml --bin osmium-build -- packages
      - name: Check configs with the compositor we ship
        run: |
          pacman -U --noconfirm repo/hyprland-rust-[0-9]*.pkg.tar.zst
          useradd -m checker
          cp -r packages/osmium-hyprland/skel/.config /home/checker/ && chown -R checker /home/checker
          # Config must parse with zero errors (unsupported hl.* calls count as errors).
          runuser -u checker -- hyprland-rust --check-config -c /home/checker/.config/hypr/hyprland.lua
          { cat /home/checker/.config/hypr/hyprland.lua; cat settings/sample-settings.lua; } > /tmp/settings.lua
          runuser -u checker -- hyprland-rust --check-config -c /tmp/settings.lua
          # Third-party dots (ii, m3ww): config errors are reported as warnings, not fatal, so a
          # hyprland-rust gap does not block the ISOs. See docs/hyprland-rust-gaps.md.
          for pkg in repo/osmium-dots-*.pkg.tar.zst; do
            d=$(mktemp -d); bsdtar -xf "$pkg" -C "$d" usr/share/osmium/dots 2>/dev/null || continue
            for dot in "$d"/usr/share/osmium/dots/*/; do
              id=$(basename "$dot"); h=/home/check-$id
              [ -d "$dot/home/.config/hypr" ] || continue
              rm -rf "$h"; cp -a "$dot/home" "$h"; chown -R checker "$h"
              cfg=$h/.config/hypr/hyprland.lua; [ -f "$cfg" ] || cfg=$h/.config/hypr/hyprland.conf
              if out=$(runuser -u checker -- env HOME="$h" hyprland-rust --check-config -c "$cfg" 2>&1); then
                echo "$id: $(echo "$out" | tail -1)"
              else
                echo "$out"; echo "::warning title=$id dots on hyprland-rust::$(echo "$out" | tail -1)"
              fi
            done
          done
          # Every mode's hypr line must be accepted by a running (headless) compositor.
          install -d -o checker -m 700 /tmp/xdg
          cat > /tmp/modes.sh <<'SH'
          export XDG_RUNTIME_DIR=/tmp/xdg
          hyprland-rust --backend headless >/tmp/hr.log 2>&1 &
          for i in $(seq 20); do hyprctl version >/dev/null 2>&1 && break; sleep 0.5; done
          rc=0
          for f in tools/data/modes/*.mode; do
            sed -n 's/^hypr *= *//p' "$f" | while read -r l; do
              r=$(hyprctl keyword $l); [ "$r" = ok ] || { echo "$f: $l -> $r"; exit 1; }
            done || rc=1
          done
          kill %1
          exit $rc
          SH
          runuser -u checker -- sh /tmp/modes.sh || { cat /tmp/hr.log; exit 1; }
      - name: Pass the repo to the ISO job (branches)
        if: github.ref != 'refs/heads/main'
        uses: actions/upload-artifact@v7
        with:
          name: repo
          path: repo/
          retention-days: 3
          compression-level: 0
      - name: Publish pacman repo
        if: github.ref == 'refs/heads/main'
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release view repo -R "$GITHUB_REPOSITORY" >/dev/null 2>&1 || \
            gh release create repo -R "$GITHUB_REPOSITORY" --title "Package repo" --notes "pacman repo for OsmiumOS" --latest=false
          # Release downloads lag a few seconds behind uploads.
          live() {
            local f url
            for f in "$@"; do
              url="https://github.com/$GITHUB_REPOSITORY/releases/download/repo/$(basename "$f")"
              for _ in $(seq 30); do curl -fsIL -o /dev/null "$url" && continue 2; sleep 5; done
              echo "::error::$url is not downloadable"; return 1
            done
          }
          # Only what this run built (work/fresh.txt): packages reused from the release are
          # already there, and re-uploading one takes it offline for a moment.
          mapfile -t fresh < work/fresh.txt
          pkgs=(); db=()
          for f in "${fresh[@]}"; do
            case $f in osmium.*) db+=("repo/$f") ;; *) pkgs+=("repo/$f") ;; esac
          done
          echo "uploading ${#pkgs[@]} package files, ${#db[@]} database files"
          # Packages first and the database last: it must never name a file that is not there yet.
          if [ ${#pkgs[@]} -gt 0 ]; then
            gh release upload repo "${pkgs[@]}" -R "$GITHUB_REPOSITORY" --clobber
            live "${pkgs[@]}"
          fi
          gh release upload repo "${db[@]}" -R "$GITHUB_REPOSITORY" --clobber
          # Drop package files no longer in the repo db.
          for a in $(gh release view repo -R "$GITHUB_REPOSITORY" --json assets -q '.assets[].name'); do
            [ -e "repo/$a" ] || gh release delete-asset repo "$a" -R "$GITHUB_REPOSITORY" -y
          done
          # The ISO job needs the new database live.
          live "${db[@]}"

  iso:
    needs: packages
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        edition: [hyprland]
    container:
      image: archlinux:latest
      options: --privileged
    steps:
      - uses: actions/checkout@v7
      - name: Install archiso
        run: pacman -Syu --noconfirm archiso rust
      - uses: actions/download-artifact@v8
        if: github.ref != 'refs/heads/main'
        with:
          name: repo
          path: repo
      - name: Build ${{ matrix.edition }}
        run: |
          # Branches build from their own packages, not the published release.
          if [ -d repo ]; then export OSMIUM_REPO="file://$PWD/repo"; fi
          cargo run --release --locked --manifest-path tools/Cargo.toml --bin osmium-build -- iso ${{ matrix.edition }}
      - uses: actions/upload-artifact@v7
        with:
          name: osmiumos-${{ matrix.edition }}
          path: out/*.iso
          compression-level: 0

  # Boots the Hyprland ISO in QEMU (UEFI) and installs with osmium-install three times: plain,
  # then LUKS over it (wiping it) with Secure Boot firmware in Setup Mode and a software TPM,
  # then plain on a second disk. Then boots both systems: the LUKS one twice (passphrase, then
  # TPM2 unlock), the plain one through a good update and a broken one that must roll back.
  # Scripts: .github/ci/.
  install-test:
    needs: iso
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v7
        with:
          sparse-checkout: .github/ci
      - uses: actions/download-artifact@v8
        with:
          name: osmiumos-hyprland
      - name: Install QEMU
        run: sudo apt-get update -q && sudo apt-get install -y -q qemu-system-x86 ovmf swtpm swtpm-tools libarchive-tools socat
      - name: Install from the live ISO
        id: install
        run: |
          iso=$(ls *.iso)
          bsdtar -xf "$iso" arch/boot/x86_64 loader boot/grub 2>/dev/null || true
          params=$(grep -rhom1 'archisobasedir=[^ ]* archisosearchuuid=[^ ]*' loader boot | head -1)
          [ -n "$params" ] || { echo "no archiso boot parameters found in the ISO"; exit 1; }
          for d in luks plain; do qemu-img create -q -f qcow2 disk-$d.qcow2 24G; done
          qemu-img create -q -f qcow2 disk-win.qcow2 64G
          for v in wipe luks plain win; do cp /usr/share/OVMF/OVMF_VARS_4M.fd vars-$v.fd; done
          mkdir -p tpm
          # inst <enc> <disk> <vars> <secure boot> <log name> [windows]
          inst() {
            { echo "enc=$1"; echo "win=${6:-0}"; echo "cat > /tmp/boot-test.sh <<'BOOTTEST'"; cat .github/ci/boot-test.sh; echo BOOTTEST
              cat .github/ci/install-body.sh; } > test.img
            truncate -s 1M test.img
            if [ "$4" = 1 ]; then sudo pkill swtpm || true; sudo swtpm socket --tpmstate dir=tpm --ctrl type=unixio,path=tpm.sock --tpm2 --daemon; fi
            sudo env DISK=$2 VARS=$3 SB=$4 .github/ci/vm.sh install-$5.log -cdrom "$iso" \
              -drive if=none,id=s,file=test.img,format=raw,readonly=on -device virtio-blk-pci,drive=s,serial=osmtest \
              -kernel arch/boot/x86_64/vmlinuz-linux-zen -initrd arch/boot/x86_64/initramfs-linux-zen.img \
              -append "$params console=ttyS0 systemd.run=\"/bin/sh /dev/disk/by-id/virtio-osmtest\"" || true
            grep -a 'OSMIUM-' install-$5.log | grep -av '"step":"copy"' | cut -c1-400 || true
          }
          inst 0 disk-luks.qcow2 vars-wipe.fd 0 wipe
          inst 1 disk-luks.qcow2 vars-luks.fd 1 luks
          inst 0 disk-plain.qcow2 vars-plain.fd 0 plain
          inst 0 disk-win.qcow2 vars-win.fd 0 win 1
          grep -aq OSMIUM-INSTALL-OK install-wipe.log || { echo "::error::first plain install failed"; tail -60 install-wipe.log; exit 1; }
          grep -aq OSMIUM-LUKS-OK install-luks.log || { echo "::error::encrypted install failed"; tail -60 install-luks.log; exit 1; }
          grep -aq OSMIUM-LUKS2-OK install-luks.log || { echo "::error::the disk is not LUKS2"; exit 1; }
          grep -aq OSMIUM-INSTALL-OK install-plain.log || { echo "::error::install failed"; tail -60 install-plain.log; exit 1; }
          grep -aq OSMIUM-WINDOWS-INTACT install-win.log || { echo "::error::the NTFS partition did not survive the install next to it"; tail -60 install-win.log; exit 1; }
          grep -aq OSMIUM-ESP-SHARED-OK install-win.log || { echo "::error::systemd-boot is not on the Windows ESP next to Windows Boot Manager"; exit 1; }
          for l in luks plain win; do
            grep -aq OSMIUM-ESP-OK install-$l.log || { echo "::error::$l: no signed UKI / systemd-boot on the ESP"; exit 1; }
            echo "Install ($l, 4 cores): $(grep -ao 'OSMIUM-RUN-. {"done":true,"seconds":[0-9]*' install-$l.log | grep -o '[0-9]*$') s" >> "$GITHUB_STEP_SUMMARY"
          done
          if grep -aq 'OSMIUM-LEFT-' install-*.log; then echo "::warning::the installer left the target disk mounted or open"; fi
      - name: Live desktop and installer window
        if: ${{ !cancelled() && steps.install.outcome == 'success' }}
        run: |
          iso=$(ls *.iso)
          params=$(grep -rhom1 'archisobasedir=[^ ]* archisosearchuuid=[^ ]*' loader boot | head -1)
          cp .github/ci/ui-test.sh ui.img; truncate -s 1M ui.img
          qemu-img create -q -f qcow2 disk-ui.qcow2 1G; cp /usr/share/OVMF/OVMF_VARS_4M.fd vars-ui.fd
          sudo env DISK=disk-ui.qcow2 VARS=vars-ui.fd MINUTES=10 .github/ci/vm.sh ui.log -cdrom "$iso" -vga virtio \
            -drive if=none,id=s,file=ui.img,format=raw,readonly=on -device virtio-blk-pci,drive=s,serial=osmtest \
            -kernel arch/boot/x86_64/vmlinuz-linux-zen -initrd arch/boot/x86_64/initramfs-linux-zen.img \
            -append "$params console=ttyS0 systemd.run=\"/bin/sh /dev/disk/by-id/virtio-osmtest\"" || true
          sudo grep -a 'OSMIUM-' ui.log | grep -av SCREENSHOT | cut -c1-400 || true
          sudo grep -ao 'OSMIUM-SCREENSHOT [A-Za-z0-9+/=]*' ui.log | head -1 | cut -d' ' -f2 | base64 -d > installer.png || true
          sudo grep -ao 'OSMIUM-PREVIEW [A-Za-z0-9+/=]*' ui.log | head -1 | cut -d' ' -f2 | base64 -d > preview-synthwave.png || true
          [ -s preview-synthwave.png ] || echo "::warning::osmium-dots onizle made no screenshot in the live desktop"
          sudo grep -aq OSMIUM-UI-RUNNING ui.log || { echo "::error::the installer window did not start in the live desktop"; exit 1; }
          sudo grep -aq OSMIUM-UI-CLEAN ui.log || { echo "::error::the installer QML logged errors (see OSMIUM-UI-LOG lines)"; exit 1; }
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: installer-screenshot
          path: |
            installer.png
            preview-synthwave.png
          if-no-files-found: ignore
      - name: Boot the plain install (update, bless, broken update, rollback)
        if: ${{ !cancelled() && steps.install.outcome == 'success' }}
        run: |
          # Reboots are allowed: the test reboots twice itself, and the broken kernel three times.
          sudo env DISK=disk-plain.qcow2 VARS=vars-plain.fd REBOOT=1 MINUTES=25 .github/ci/vm.sh boot-plain.log || true
          sudo cat boot-plain.log | cut -c1-400 || true
          need() { sudo grep -aq "OSMIUM-$1" boot-plain.log || { echo "::error::$2"; exit 1; }; }
          need BOOT-OK "the installed system did not boot to multi-user"
          sudo grep -aq OSMIUM-DOTS-OK boot-plain.log || echo "::warning::ii dots were not applied to the installed user"
          sudo grep -aq OSMIUM-PKG-FILES-OK boot-plain.log || echo "::warning::installed packages are missing files (pacman -Qk)"
          sudo grep -aq OSMIUM-SNAPSHOT-OK boot-plain.log || echo "::warning::no 'Kurulum' snapper snapshot after install"
          # Serial log lines end in CR, so require a unit name, not just any character.
          if sudo grep -aqE "OSMIUM-FAILED-UNITS [[:alnum:]@_.-]+" boot-plain.log; then echo "::error::units failed on the installed system"; exit 1; fi
          need UPDATE-ARMED "osmium-boot kur did not install the update"
          need BLESS-OK "the updated entry was not blessed after a good boot"
          need BROKEN-BUILT "could not build the broken test kernel"
          need ROLLBACK-OK "a kernel that does not boot was not rolled back"
          need MIX-OK "osmium-dots karistir/apply of a mixed dot failed"
      - name: Boot the install next to Windows
        if: ${{ !cancelled() && steps.install.outcome == 'success' }}
        run: |
          sudo env DISK=disk-win.qcow2 VARS=vars-win.fd MINUTES=8 .github/ci/vm.sh boot-win.log || true
          sudo cat boot-win.log | cut -c1-400 || true
          sudo grep -aq OSMIUM-BOOT-OK boot-win.log || { echo "::error::the install next to Windows did not boot"; exit 1; }
          sudo grep -aq OSMIUM-XBOOTLDR-OK boot-win.log || { echo "::error::/boot is not the XBOOTLDR partition"; exit 1; }
      - name: Boot the LUKS install (Secure Boot, then TPM2 unlock)
        if: ${{ !cancelled() && steps.install.outcome == 'success' }}
        run: |
          tpm() { sudo pkill swtpm || true; sleep 1; sudo swtpm socket --tpmstate dir=tpm --ctrl type=unixio,path=tpm.sock --tpm2 --daemon; }
          tpm
          # First boot: the passphrase comes as a systemd credential; typed keys are the fallback
          # (only letters and digits: the initramfs keymap is Turkish Q).
          ( for r in 1 2 3; do sleep 45; for k in p a r o l a 2 0 2 6 s v ret; do echo "sendkey $k" | sudo socat - unix-connect:mon.sock >/dev/null 2>&1; done; done ) &
          sudo env DISK=disk-luks.qcow2 VARS=vars-luks.fd SB=1 MINUTES=10 .github/ci/vm.sh boot-luks-1.log \
            -smbios type=11,value=io.systemd.credential:cryptsetup.passphrase=parola2026sv || true
          wait
          sudo cat boot-luks-1.log | cut -c1-400 || true
          tpm
          # Second boot: nothing types the passphrase; only the TPM can open the disk.
          sudo env DISK=disk-luks.qcow2 VARS=vars-luks.fd SB=1 MINUTES=6 .github/ci/vm.sh boot-luks-2.log || true
          sudo cat boot-luks-2.log | cut -c1-400 || true
          sudo grep -aq OSMIUM-BOOT-OK boot-luks-1.log || { echo "::error::the encrypted system did not boot"; exit 1; }
          sudo grep -aq "OSMIUM-SECUREBOOT 1 SETUPMODE 0" boot-luks-1.log || { echo "::error::Secure Boot is not on after the install enrolled the keys"; exit 1; }
          sudo grep -aq OSMIUM-TPM-ENROLLED boot-luks-1.log || { echo "::error::no TPM2 token after the first boot"; exit 1; }
          sudo grep -aq OSMIUM-TPM-KEY-GONE boot-luks-1.log || echo "::warning::the one-time key file is still there"
          sudo grep -aq OSMIUM-TPM-UNLOCK-OK boot-luks-2.log || { echo "::error::the disk did not open with the TPM"; exit 1; }
      - name: Screen of a hung VM
        if: failure()
        run: echo "screendump screen.ppm" | sudo socat - unix-connect:mon.sock || true
      - uses: actions/upload-artifact@v7
        if: failure()
        with:
          name: install-test-logs
          path: |
            install-*.log
            boot-*.log
            ui.log
            screen.ppm
