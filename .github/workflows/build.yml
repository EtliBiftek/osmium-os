name: Build ISO
on:
  workflow_dispatch:
  push:
    branches: [main]

# One build at a time: runs share the published repo release.
concurrency:
  group: build
  cancel-in-progress: true

jobs:
  packages:
    runs-on: ubuntu-latest
    container: archlinux:latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
      - name: Install tools
        # Build deps of our packages (osmium-build runs makepkg with --nodeps).
        run: pacman -Syu --noconfirm base-devel git python rust github-cli pacman-contrib librsvg wayland libxkbcommon libinput seatd systemd-libs libdrm mesa libglvnd boost gtk3
      - name: Test tools
        run: cargo test --locked --manifest-path tools/Cargo.toml
      - name: Smoke-test osmium-update against live Arch News
        run: |
          cargo run -q --locked --manifest-path tools/Cargo.toml --bin osmium-update -- check || [ $? -eq 2 ]
      - name: Import signing key
        env:
          KEY: ${{ secrets.OSMIUM_GPG_PRIVATE_KEY }}
        run: |
          if [ -n "$KEY" ]; then echo "$KEY" | gpg --batch --import; else echo "no signing key: repo stays unsigned"; fi
      - name: Build packages
        env:
          OSMIUM_REPO: https://github.com/${{ github.repository }}/releases/download/repo
          OSMIUM_GPG_KEY_ID: ${{ secrets.OSMIUM_GPG_KEY_ID }}
        run: cargo run --release --locked --manifest-path tools/Cargo.toml --bin osmium-build -- packages
      - name: Check configs with the compositor we ship
        run: |
          pacman -U --noconfirm repo/hyprland-rust-[0-9]*.pkg.tar.zst
          useradd -m checker
          cp -r packages/osmium-hyprland/skel/.config /home/checker/ && chown -R checker /home/checker
          # Config must parse with zero errors (unsupported hl.* calls count as errors).
          runuser -u checker -- hyprland-rust --check-config -c /home/checker/.config/hypr/hyprland.lua
          { cat /home/checker/.config/hypr/hyprland.lua; cat settings/sample-settings.lua; } > /tmp/settings.lua
          runuser -u checker -- hyprland-rust --check-config -c /tmp/settings.lua
          # Third-party dots (ii, m3ww): config errors are reported as warnings, not fatal, so a
          # hyprland-rust gap does not block the ISOs. See docs/hyprland-rust-gaps.md.
          for pkg in repo/osmium-dots-*.pkg.tar.zst; do
            d=$(mktemp -d); bsdtar -xf "$pkg" -C "$d" usr/share/osmium/dots 2>/dev/null || continue
            for dot in "$d"/usr/share/osmium/dots/*/; do
              id=$(basename "$dot"); h=/home/check-$id
              [ -d "$dot/home/.config/hypr" ] || continue
              rm -rf "$h"; cp -a "$dot/home" "$h"; chown -R checker "$h"
              cfg=$h/.config/hypr/hyprland.lua; [ -f "$cfg" ] || cfg=$h/.config/hypr/hyprland.conf
              if out=$(runuser -u checker -- env HOME="$h" hyprland-rust --check-config -c "$cfg" 2>&1); then
                echo "$id: $(echo "$out" | tail -1)"
              else
                echo "$out"; echo "::warning title=$id dots on hyprland-rust::$(echo "$out" | tail -1)"
              fi
            done
          done
          # Every mode's hypr line must be accepted by a running (headless) compositor.
          install -d -o checker -m 700 /tmp/xdg
          cat > /tmp/modes.sh <<'SH'
          export XDG_RUNTIME_DIR=/tmp/xdg
          hyprland-rust --backend headless >/tmp/hr.log 2>&1 &
          for i in $(seq 20); do hyprctl version >/dev/null 2>&1 && break; sleep 0.5; done
          rc=0
          for f in tools/data/modes/*.mode; do
            sed -n 's/^hypr *= *//p' "$f" | while read -r l; do
              r=$(hyprctl keyword $l); [ "$r" = ok ] || { echo "$f: $l -> $r"; exit 1; }
            done || rc=1
          done
          kill %1
          exit $rc
          SH
          runuser -u checker -- sh /tmp/modes.sh || { cat /tmp/hr.log; exit 1; }
      - name: Publish pacman repo
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release view repo -R "$GITHUB_REPOSITORY" >/dev/null 2>&1 || \
            gh release create repo -R "$GITHUB_REPOSITORY" --title "Package repo" --notes "pacman repo for OsmiumOS" --latest=false
          # Release downloads lag a few seconds behind uploads.
          live() {
            local f url
            for f in "$@"; do
              url="https://github.com/$GITHUB_REPOSITORY/releases/download/repo/$(basename "$f")"
              for _ in $(seq 30); do curl -fsIL -o /dev/null "$url" && continue 2; sleep 5; done
              echo "::error::$url is not downloadable"; return 1
            done
          }
          # Only what this run built (work/fresh.txt): packages reused from the release are
          # already there, and re-uploading one takes it offline for a moment.
          mapfile -t fresh < work/fresh.txt
          pkgs=(); db=()
          for f in "${fresh[@]}"; do
            case $f in osmium.*) db+=("repo/$f") ;; *) pkgs+=("repo/$f") ;; esac
          done
          echo "uploading ${#pkgs[@]} package files, ${#db[@]} database files"
          # Packages first and the database last: it must never name a file that is not there yet.
          if [ ${#pkgs[@]} -gt 0 ]; then
            gh release upload repo "${pkgs[@]}" -R "$GITHUB_REPOSITORY" --clobber
            live "${pkgs[@]}"
          fi
          gh release upload repo "${db[@]}" -R "$GITHUB_REPOSITORY" --clobber
          # Drop package files no longer in the repo db.
          for a in $(gh release view repo -R "$GITHUB_REPOSITORY" --json assets -q '.assets[].name'); do
            [ -e "repo/$a" ] || gh release delete-asset repo "$a" -R "$GITHUB_REPOSITORY" -y
          done
          # The ISO job needs the new database live.
          live "${db[@]}"

  iso:
    needs: packages
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        edition: [hyprland]
    container:
      image: archlinux:latest
      options: --privileged
    steps:
      - uses: actions/checkout@v7
      - name: Install archiso
        run: pacman -Syu --noconfirm archiso rust
      - name: Build ${{ matrix.edition }}
        run: cargo run --release --locked --manifest-path tools/Cargo.toml --bin osmium-build -- iso ${{ matrix.edition }}
      - uses: actions/upload-artifact@v7
        with:
          name: osmiumos-${{ matrix.edition }}
          path: out/*.iso
          compression-level: 0

  # Boots the Hyprland ISO in QEMU (UEFI), installs to a virtual disk with osmium-install
  # (once with LUKS, once without), then boots the installed disk.
  install-test:
    needs: iso
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: osmiumos-hyprland
      - name: Install QEMU
        run: sudo apt-get update -q && sudo apt-get install -y -q qemu-system-x86 ovmf libarchive-tools socat
      - name: Install from the live ISO
        run: |
          iso=$(ls *.iso)
          bsdtar -xf "$iso" arch/boot/x86_64 loader boot/grub 2>/dev/null || true
          params=$(grep -rhom1 'archisobasedir=[^ ]* archisosearchuuid=[^ ]*' loader boot | head -1)
          [ -n "$params" ] || { echo "no archiso boot parameters found in the ISO"; exit 1; }
          cp /usr/share/OVMF/OVMF_VARS_4M.fd vars.fd
          qemu-img create -q -f qcow2 disk.qcow2 24G
          # Runs in the live system as root via systemd.run=, read straight from a read-only disk.
          # The workflow prepends `enc=1` or `enc=0`.
          cat > test.body <<'EOF'
          exec >/dev/ttyS0 2>&1
          for i in $(seq 50); do [ -e /dev/disk/by-id/virtio-target ] && break; sleep 0.2; done
          disk=$(readlink -f /dev/disk/by-id/virtio-target)
          echo "OSMIUM-DISKS $(osmium-install disks)"
          printf 'disk=%s\nencrypt=%s\npassphrase=ci-test-pass\nhostname=osmium-test\nusername=tester\nfullname=Test User\npassword=ci-test-pw\ntimezone=Europe/Istanbul\nlocale=tr_TR.UTF-8\nkeymap=trq\nxkblayout=tr\ndots=ii\ndots_mode=config\n' "$disk" "$enc" \
            | osmium-install run | sed "s/^/OSMIUM-RUN-$enc /"
          # Whatever still holds the target after the installer returned (should be nothing).
          findmnt -rn -o TARGET,SOURCE | grep -E '^/mnt|cryptroot' | sed 's/^/OSMIUM-LEFT-MOUNT /'
          [ -e /dev/mapper/cryptroot ] && echo "OSMIUM-LEFT-OPEN $(dmsetup info -c --noheadings -o name,open cryptroot)"
          for p in /proc/[0-9]*; do
            grep -qE "cryptroot|$disk" "$p/mountinfo" 2>/dev/null \
              && echo "OSMIUM-HOLDER ${p#/proc/} $(cat "$p/comm") root=$(readlink "$p/root") ns=$(readlink "$p/ns/mnt")"
          done | head -20
          mkdir -p /tmp/r
          if [ "$enc" = 1 ]; then
            # The encrypted install is only checked for a root that unlocks and mounts.
            dev=/dev/mapper/citest
            printf ci-test-pass | cryptsetup open --key-file=- "${disk}2" citest || dev=/dev/mapper/cryptroot
            mount -o ro,subvol=@ "$dev" /tmp/r && [ -s /tmp/r/boot/grub/grub.cfg ] && [ -s /tmp/r/boot/initramfs-linux-zen.img ] \
              && echo OSMIUM-LUKS-OK
            # GRUB reads the passphrase with a US keymap: slot 0 holds what the same keys type there (tr).
            printf "c'=test=pass" | cryptsetup open --test-passphrase --key-slot 0 --key-file=- "${disk}2" && echo OSMIUM-GRUBKEY-OK
            poweroff -f
            sleep 60
          fi
          mount -o subvol=@ "${disk}2" /tmp/r || { echo OSMIUM-INSTALL-FAILED; poweroff -f; sleep 60; }
          cat /tmp/r/etc/fstab
          cat > /tmp/r/usr/local/bin/osmium-boot-test <<'SH'
          #!/bin/sh
          exec >/dev/ttyS0 2>&1
          sleep 20
          echo "OSMIUM-FAILED-UNITS $(systemctl --failed --no-legend --plain | tr '\n' ';')"
          echo "OSMIUM-GREETD $(systemctl is-active greetd)"
          journalctl -b -p err --no-pager | tail -40
          [ -d /home/tester/.config/quickshell/ii ] && echo OSMIUM-DOTS-OK
          # Smoke-run the read-only tools on a real installed system (output only, never fatal).
          for t in "osmium-doctor" "osmium-hw" "osmium-changes list" "osmium-auto check" "osmium-battery" "osmium-guest status" "osmium-apply plan /dev/null"; do
            echo "OSMIUM-TOOL $t -> exit $(timeout 60 $t </dev/null >/tmp/t.out 2>&1; echo $?)"
            head -c 1500 /tmp/t.out | sed 's/^/  | /'
          done
          pacman -Qkq >/tmp/qk 2>&1 && echo OSMIUM-PKG-FILES-OK || sed 's/^/OSMIUM-MISSING /' /tmp/qk | head -20
          snapper --no-dbus -c root list | grep -q Kurulum && echo OSMIUM-SNAPSHOT-OK
          [ "$(cat /etc/hostname)" = osmium-test ] && id tester && ! id osmium 2>/dev/null && echo OSMIUM-BOOT-OK
          systemctl poweroff
          SH
          chmod +x /tmp/r/usr/local/bin/osmium-boot-test
          printf '[Unit]\nAfter=systemd-user-sessions.service\n[Service]\nType=oneshot\nExecStart=/usr/local/bin/osmium-boot-test\n' \
            > /tmp/r/etc/systemd/system/osmium-boot-test.service
          ln -s ../osmium-boot-test.service /tmp/r/etc/systemd/system/multi-user.target.wants/
          [ -s /tmp/r/boot/grub/grub.cfg ] && grep -q '^tester:' /tmp/r/etc/passwd && echo OSMIUM-INSTALL-OK
          umount /tmp/r; sync
          poweroff -f
          sleep 60
          EOF
          cat > vm.sh <<'EOF'
          #!/bin/sh
          # vm.sh <log> [extra qemu args]: the VM with the target disk; serial goes to <log>.
          log=$1; shift
          exec timeout 20m qemu-system-x86_64 -enable-kvm -cpu host -machine q35 -m 6G -smp 4 -display none -no-reboot \
            -drive if=pflash,format=raw,readonly=on,file=/usr/share/OVMF/OVMF_CODE_4M.fd \
            -drive if=pflash,format=raw,file=vars.fd \
            -drive if=none,id=t,file=disk.qcow2,format=qcow2,discard=unmap -device virtio-blk-pci,drive=t,serial=target \
            -nic user,model=virtio-net-pci -monitor unix:mon.sock,server,nowait -serial "file:$log" "$@"
          EOF
          chmod +x vm.sh
          # Encrypted first, then unencrypted over it (the second run also has to wipe the first).
          for enc in 1 0; do
            { echo "enc=$enc"; cat test.body; } > test.img
            truncate -s 1M test.img
            sudo ./vm.sh install-$enc.log -cdrom "$iso" \
              -drive if=none,id=s,file=test.img,format=raw,readonly=on -device virtio-blk-pci,drive=s,serial=osmtest \
              -kernel arch/boot/x86_64/vmlinuz-linux-zen -initrd arch/boot/x86_64/initramfs-linux-zen.img \
              -append "$params console=ttyS0 systemd.run=\"/bin/sh /dev/disk/by-id/virtio-osmtest\"" || true
            grep -a 'OSMIUM-' install-$enc.log | grep -av '"step":"copy"' | cut -c1-400 || true
          done
          grep -aq OSMIUM-LUKS-OK install-1.log || { echo "::error::encrypted install failed"; tail -60 install-1.log; exit 1; }
          grep -aq OSMIUM-GRUBKEY-OK install-1.log || { echo "::error::no LUKS key slot for the passphrase as GRUB reads it"; exit 1; }
          grep -aq OSMIUM-INSTALL-OK install-0.log || { echo "::error::install failed"; tail -60 install-0.log; exit 1; }
          for enc in 1 0; do
            echo "Install (encrypt=$enc, 4 cores): $(grep -ao 'OSMIUM-RUN-. {"done":true,"seconds":[0-9]*' install-$enc.log | grep -o '[0-9]*$') s" >> "$GITHUB_STEP_SUMMARY"
          done
          if grep -aq 'OSMIUM-LEFT-' install-*.log; then echo "::warning::the installer left the target disk mounted or open"; fi
      - name: Boot the installed system
        run: |
          sudo ./vm.sh boot.log &
          for i in $(seq 120); do
            sleep 5
            sudo grep -aq OSMIUM-BOOT-OK boot.log 2>/dev/null && break
            pgrep -f qemu-system >/dev/null || break
          done
          sudo cat boot.log | cut -c1-400 || true
          if ! sudo grep -aq OSMIUM-BOOT-OK boot.log; then
            echo "screendump screen.ppm" | sudo socat - unix-connect:mon.sock || true
            sleep 2; echo "::error::the installed system did not boot to multi-user"; exit 1
          fi
          sudo grep -aq OSMIUM-DOTS-OK boot.log || echo "::warning::ii dots were not applied to the installed user"
          sudo grep -aq OSMIUM-PKG-FILES-OK boot.log || echo "::warning::installed packages are missing files (pacman -Qk)"
          sudo grep -aq OSMIUM-SNAPSHOT-OK boot.log || echo "::warning::no 'Kurulum' snapper snapshot after install"
          # Serial log lines end in CR, so require a unit name, not just any character.
          if sudo grep -aqE "OSMIUM-FAILED-UNITS [[:alnum:]@_.-]+" boot.log; then echo "::error::units failed on the installed system"; exit 1; fi
      - uses: actions/upload-artifact@v7
        if: failure()
        with:
          name: install-test-logs
          path: |
            install-*.log
            boot.log
            screen.ppm
