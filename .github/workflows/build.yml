name: Build ISO
on:
  workflow_dispatch:
  push:
    branches: [main]

jobs:
  packages:
    runs-on: ubuntu-latest
    container: archlinux:latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Install tools
        run: pacman -Syu --noconfirm base-devel github-cli hyprland
      - name: Verify Hyprland config
        run: Hyprland --verify-config --config packages/osmium-hyprland/skel/.config/hypr/hyprland.conf
      - name: Build packages
        run: bash build-packages.sh
      - name: Publish pacman repo
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release view repo -R "$GITHUB_REPOSITORY" >/dev/null 2>&1 || \
            gh release create repo -R "$GITHUB_REPOSITORY" --title "Package repo" --notes "pacman repo for OsmiumOS" --latest=false
          gh release upload repo repo/* -R "$GITHUB_REPOSITORY" --clobber

  iso:
    needs: packages
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        edition: [hyprland]  # later: kde, gnome
    container:
      image: archlinux:latest
      options: --privileged
    steps:
      - uses: actions/checkout@v4
      - name: Install archiso
        run: pacman -Syu --noconfirm archiso
      - name: Build ${{ matrix.edition }}
        run: bash build.sh ${{ matrix.edition }}
      - uses: actions/upload-artifact@v4
        with:
          name: osmiumos-${{ matrix.edition }}
          path: out/*.iso
          compression-level: 0
