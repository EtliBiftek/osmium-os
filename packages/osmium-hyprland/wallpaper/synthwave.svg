<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1920 1080" width="1920" height="1080">
  <!-- OsmiumOS synthwave wallpaper. Text-free so it renders the same without fonts. -->
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#07021a"/>
      <stop offset="0.45" stop-color="#1a1033"/>
      <stop offset="0.75" stop-color="#4a0f5c"/>
      <stop offset="1" stop-color="#ff2bd6"/>
    </linearGradient>
    <linearGradient id="sun" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffe259"/>
      <stop offset="0.5" stop-color="#ffb000"/>
      <stop offset="1" stop-color="#ff2bd6"/>
    </linearGradient>
    <linearGradient id="floor" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#2a0845"/>
      <stop offset="1" stop-color="#07021a"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#ff2bd6" stop-opacity="0.55"/>
      <stop offset="1" stop-color="#ff2bd6" stop-opacity="0"/>
    </radialGradient>
    <!-- Horizontal gaps cut through the lower half of the sun. -->
    <mask id="sunbands">
      <rect width="1920" height="1080" fill="white"/>
      <rect x="0" y="470" width="1920" height="6" fill="black"/>
      <rect x="0" y="505" width="1920" height="9" fill="black"/>
      <rect x="0" y="540" width="1920" height="12" fill="black"/>
      <rect x="0" y="575" width="1920" height="15" fill="black"/>
      <rect x="0" y="610" width="1920" height="18" fill="black"/>
    </mask>
    <clipPath id="below"><rect x="0" y="640" width="1920" height="440"/></clipPath>
    <filter id="neon" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <rect width="1920" height="1080" fill="url(#sky)"/>

  <!-- Stars -->
  <g fill="#ffffff">
    <circle cx="120" cy="90" r="1.6"/><circle cx="310" cy="160" r="1.1"/><circle cx="480" cy="60" r="1.4"/>
    <circle cx="640" cy="200" r="1"/><circle cx="820" cy="110" r="1.7"/><circle cx="1010" cy="70" r="1.2"/>
    <circle cx="1180" cy="170" r="1.5"/><circle cx="1350" cy="90" r="1"/><circle cx="1530" cy="140" r="1.6"/>
    <circle cx="1720" cy="60" r="1.2"/><circle cx="1840" cy="210" r="1.4"/><circle cx="230" cy="280" r="1"/>
    <circle cx="1620" cy="300" r="1.1"/><circle cx="70" cy="380" r="1.3"/><circle cx="1880" cy="400" r="1"/>
    <circle cx="560" cy="330" r="0.9"/><circle cx="1420" cy="260" r="0.9"/><circle cx="900" cy="250" r="0.8"/>
  </g>

  <!-- Sun with glow -->
  <circle cx="960" cy="520" r="330" fill="url(#glow)"/>
  <circle cx="960" cy="520" r="220" fill="url(#sun)" mask="url(#sunbands)"/>

  <!-- Mountains -->
  <path d="M0 640 L180 520 L300 590 L470 450 L640 600 L760 540 L900 640 Z" fill="#12052a"/>
  <path d="M1020 640 L1160 560 L1290 610 L1450 470 L1600 590 L1740 500 L1920 620 L1920 640 Z" fill="#12052a"/>
  <path d="M0 640 L180 520 L300 590 L470 450 L640 600 L760 540 L900 640" fill="none" stroke="#00e5ff" stroke-width="2" filter="url(#neon)"/>
  <path d="M1020 640 L1160 560 L1290 610 L1450 470 L1600 590 L1740 500 L1920 620" fill="none" stroke="#00e5ff" stroke-width="2" filter="url(#neon)"/>

  <!-- Floor and perspective grid -->
  <rect x="0" y="640" width="1920" height="440" fill="url(#floor)"/>
  <g clip-path="url(#below)" stroke="#ff2bd6" stroke-width="2" filter="url(#neon)">
    <!-- Lines converge on the vanishing point at (960, 640). -->
    <line x1="960" y1="640" x2="-2400" y2="1080"/><line x1="960" y1="640" x2="-1680" y2="1080"/>
    <line x1="960" y1="640" x2="-1080" y2="1080"/><line x1="960" y1="640" x2="-600" y2="1080"/>
    <line x1="960" y1="640" x2="-180" y2="1080"/><line x1="960" y1="640" x2="200" y2="1080"/>
    <line x1="960" y1="640" x2="580" y2="1080"/><line x1="960" y1="640" x2="960" y2="1080"/>
    <line x1="960" y1="640" x2="1340" y2="1080"/><line x1="960" y1="640" x2="1720" y2="1080"/>
    <line x1="960" y1="640" x2="2100" y2="1080"/><line x1="960" y1="640" x2="2520" y2="1080"/>
    <line x1="960" y1="640" x2="3000" y2="1080"/><line x1="960" y1="640" x2="3600" y2="1080"/>
    <line x1="960" y1="640" x2="4320" y2="1080"/>
    <!-- Horizontal lines get further apart toward the viewer. -->
    <line x1="0" y1="648" x2="1920" y2="648"/><line x1="0" y1="660" x2="1920" y2="660"/>
    <line x1="0" y1="678" x2="1920" y2="678"/><line x1="0" y1="703" x2="1920" y2="703"/>
    <line x1="0" y1="738" x2="1920" y2="738"/><line x1="0" y1="786" x2="1920" y2="786"/>
    <line x1="0" y1="850" x2="1920" y2="850"/><line x1="0" y1="935" x2="1920" y2="935"/>
    <line x1="0" y1="1045" x2="1920" y2="1045"/>
  </g>
  <line x1="0" y1="640" x2="1920" y2="640" stroke="#00e5ff" stroke-width="3" filter="url(#neon)"/>
</svg>
