general {
    lock_cmd = pidof hyprlock || hyprlock
    before_sleep_cmd = loginctl lock-session
}

listener {
    timeout = 300
    on-timeout = loginctl lock-session
}

# No screen-off listener: hyprland-rust's `dpms` dispatcher only sets a flag (the screen stays on)
# and wlr-output-power-management is not offered. Add one when the compositor supports DPMS.
