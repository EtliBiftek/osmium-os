---
modules-search: [ local ]

instances:
- id: postinstall
  module: shellprocess
  config: shellprocess-postinstall.conf

sequence:
- show:
  - welcome
  - locale
  - keyboard
  - partition
  - users
  - summary
- exec:
  - partition
  - mount
  - unpackfs
  - machineid
  - fstab
  - locale
  - keyboard
  - localecfg
  - users
  - networkcfg
  - hwclock
  - shellprocess@postinstall
  - initcpiocfg
  - initcpio
  - services-systemd
  - bootloader
  - umount
- show:
  - finished

branding: osmium
prompt-install: true
dont-chroot: false
oem-setup: false
disable-cancel: false
disable-cancel-during-exec: true
quit-at-end: false
