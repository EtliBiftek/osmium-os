---
efi:
  mountPoint: "/boot/efi"
  recommendedSize: 512MiB
  minimumSize: 32MiB
  label: "EFI"
userSwapChoices:
  - none
  - file
initialSwapChoice: file
defaultFileSystemType: "btrfs"
availableFileSystemTypes: [ "btrfs", "ext4", "xfs" ]
# GRUB cannot unlock argon2 LUKS2, and /boot lives inside the encrypted root.
luksGeneration: luks1
