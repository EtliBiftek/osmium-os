---
units:
  - name: NetworkManager.service
    action: enable
    mandatory: true
  - name: greetd.service
    action: enable
    mandatory: true
  - name: snapper-timeline.timer
    action: enable
  - name: snapper-cleanup.timer
    action: enable
  - name: grub-btrfsd.service
    action: enable
  # Live ISO services the installed system must not run.
  - name: iwd.service
    action: disable
  - name: systemd-networkd.service
    action: disable
  - name: systemd-networkd.socket
    action: disable
  - name: systemd-networkd-wait-online.service
    action: disable
  - name: sshd.service
    action: disable
