---
defaultGroups:
  - name: users
    must_exist: true
    system: true
  - lp
  - video
  - network
  - storage
  - name: wheel
    must_exist: false
    system: true
  - audio
sudoersGroup: wheel
sudoersConfigureWithGroup: true
setRootPassword: false
doAutologin: false
passwordRequirements:
  minLength: 4
allowWeakPasswords: true
allowWeakPasswordsDefault: false
user:
  shell: /bin/bash
  forbidden_names: [ root, osmium ]
hostname:
  location: EtcFile
  writeHostsFile: true
  template: "osmium-${cpu}"
  forbidden_names: [ localhost ]
